{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SB — By Sabah{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
    <link rel="icon" type="image/png" href="{% static 'store/images/logo.png' %}">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo-link">
                <img src="{% static 'store/images/logo.png' %}" alt="SB — By Sabah" class="logo">
            </a>
            <nav class="main-nav">
                <a href="/">الرئيسية</a>
                <a href="/#products">المنتجات</a>
                <a href="#contact">تواصلي معنا</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" id="contact">
        <div class="container footer-inner">
            <div class="footer-col">
                <img src="{% static 'store/images/logo.png' %}" alt="SB" class="footer-logo">
                <p class="footer-tagline">جمالك يبدأ من التفاصيل</p>
            </div>
            <div class="footer-col">
                <h4>تواصلي معنا</h4>
                <a href="https://wa.me/96179022180" target="_blank" class="footer-link">
                    <i class="fab fa-whatsapp"></i> +961 79 022 180
                </a>
            </div>
            <div class="footer-col">
                <h4>تابعينا</h4>
                <div class="social-icons">
                    <a href="https://wa.me/96179022180" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 SB — By Sabah. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

</body>
</html>
